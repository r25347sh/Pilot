name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org/

      # Pages 用に CDN 版 index がある場合でも、ビルド前に Vite エントリへ戻す
      - name: Restore Vite entry for build
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Pilot - Virtual OS Prototype</title>
            </head>
            <body class="overflow-hidden">
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML
          sed -i 's/^          //' index.html

      - name: Build
        run: npm run build

      - name: Verify bundle size
        run: |
          JSFILE=$(ls dist/assets/*.js | head -1)
          SIZE=$(wc -c < "$JSFILE")
          echo "JS: $JSFILE ($SIZE bytes)"
          if [ "$SIZE" -lt 50000 ]; then
            echo "Bundle too small — abort"
            exit 1
          fi

      - name: Copy sitemap into dist
        run: |
          if [ -d sitemap ]; then
            mkdir -p dist/sitemap
            cp -r sitemap/* dist/sitemap/ || true
          fi
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # GitHub Pages が main を配信しているため、CDN 経由の本番 index を main に置く
      - name: Publish CDN index.html to main for Pages
        run: |
          JS=$(basename $(ls dist/assets/*.js | head -1))
          CSS=$(basename $(ls dist/assets/*.css | head -1))
          cat > index.html <<EOF
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Pilot - Virtual OS Prototype</title>
              <script type="module" crossorigin src="https://cdn.jsdelivr.net/gh/r25347sh/Pilot@gh-pages/assets/${JS}"></script>
              <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/r25347sh/Pilot@gh-pages/assets/${CSS}" />
            </head>
            <body class="overflow-hidden">
              <div id="root"></div>
            </body>
          </html>
          EOF
          sed -i 's/^          //' index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: production CDN index for GitHub Pages [skip ci]" || exit 0
          git push origin HEAD:main
