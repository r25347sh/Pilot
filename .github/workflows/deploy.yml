name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org/

      - name: Build
        run: npm run build

      - name: Copy sitemap into dist
        run: |
          if [ -d sitemap ]; then
            mkdir -p dist/sitemap
            cp -r sitemap/* dist/sitemap/ || true
          fi

      # Pages の公開元を「gh-pages / root」に設定してください
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
