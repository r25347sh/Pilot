name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# 権限
permissions:
  contents: read
  pages: write
  id-token: write

# 連続pushでも順番処理（進行中をキャンセルせずキューイング）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # sitemap を dist にコピー（GitHub Pages で /sitemap/ を公開するため）
      - name: Copy sitemap into dist
        run: |
          mkdir -p dist/sitemap
          cp -r sitemap/* dist/sitemap/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
