name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org/

      # Vite 用のエントリが壊れていないか確認
      - name: Ensure Vite entry
        run: |
          if ! grep -q 'src/main.jsx' index.html; then
            cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Pilot - Virtual OS Prototype</title>
            </head>
            <body class="overflow-hidden">
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML
            sed -i 's/^          //' index.html
          fi

      - name: Build
        run: npm run build

      - name: Verify bundle size
        run: |
          SIZE=$(wc -c < dist/assets/*.js | awk '{print $1}')
          echo "JS size: $SIZE"
          if [ "$SIZE" -lt 50000 ]; then
            echo "Bundle too small — React app not included"
            ls -la dist/assets/
            exit 1
          fi

      - name: Copy sitemap into dist
        run: |
          if [ -d sitemap ]; then
            mkdir -p dist/sitemap
            cp -r sitemap/* dist/sitemap/ || true
          fi
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # main ブランチを Pages が配信する場合用（CDN 経由）
      - name: Write pages-index.html artifact for main
        run: |
          JS=$(basename $(ls dist/assets/*.js | head -1))
          CSS=$(basename $(ls dist/assets/*.css | head -1))
          mkdir -p pages-root
          cat > pages-root/index.html <<EOF
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Pilot - Virtual OS Prototype</title>
              <script type="module" crossorigin src="https://cdn.jsdelivr.net/gh/r25347sh/Pilot@gh-pages/assets/${JS}"></script>
              <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/r25347sh/Pilot@gh-pages/assets/${CSS}" />
            </head>
            <body class="overflow-hidden">
              <div id="root"></div>
            </body>
          </html>
          EOF
          sed -i 's/^          //' pages-root/index.html
          # Vite 用 index は触らない。CDN 用を public ではなく専用ファイルとして main に置く
          cp pages-root/index.html index.pages.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main の配信向けに index.pages.html を更新（Vite の index.html は維持）
          git add index.pages.html
          git commit -m "chore: update index.pages.html CDN pointers [skip ci]" || true
          git push origin HEAD:main || true
