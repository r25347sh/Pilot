name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org/

      - name: Build
        run: npm run build

      - name: Copy sitemap into dist
        run: |
          if [ -d sitemap ]; then
            mkdir -p dist/sitemap
            cp -r sitemap/* dist/sitemap/ || true
          fi

      # 1) gh-pages ブランチへ（推奨: Pages ソース = gh-pages / root）
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # 2) docs/ にもコミット（Pages ソース = main / docs の場合）
      - name: Publish to docs folder on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf docs
          mkdir -p docs
          cp -r dist/* docs/
          # base が /Pilot/ なので docs 配下で問題なし
          git add -A docs
          git diff --staged --quiet && echo "No docs changes" && exit 0
          git commit -m "chore: update docs/ for GitHub Pages"
          git push origin HEAD:main
