<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { text-align: center; margin-bottom: 2rem; font-size: 1.75rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .item {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
    .item h3 { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Works / Portfolio</h1>
  <div class="grid">
    <div class="item"><h3>Project A</h3><p>実験的Webアプリ</p></div>
    <div class="item"><h3>Project B</h3><p>UI/UXプロトタイプ</p></div>
    <div class="item"><h3>Project C</h3><p>仮想OSシステム</p></div>
  </div>
</body>
</html>
