<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot - Repository Sitemap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Pilot <span class="badge">Sitemap</span></h1>
    <p class="subtitle">GitHub API から動的に取得したリポジトリ構成</p>
  </header>

  <main class="container">
    <div class="controls">
      <button id="refreshBtn" class="btn">再取得</button>
      <span id="status" class="status">読み込み中...</span>
    </div>

    <div id="tree" class="tree">
      <!-- 動的に生成 -->
    </div>
  </main>

  <footer class="footer">
    <a href="https://github.com/r25347sh/Pilot" target="_blank" rel="noopener">GitHub Repository</a>
    ·
    <a href="../">Virtual OS へ戻る</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
